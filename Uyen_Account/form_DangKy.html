<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form đăng ký</title>
  <link rel="stylesheet" type="text/css" href="/Uyen_Account/css2/styleDangKy.css">
  <script src="/Uyen_Account/js/dangky.js"></script>
</head>

<body>
  <div class="container">
    <form class="login" onsubmit="return validateForm()">
      <table width="100%" border="0" cellspacing="0" cellpadding="0" align="center">
        <tr bgcolor="##405151">
          <td colspan="2">
            <h3 align="center" style="color: white;">SIGN UP</h3>
          </td>
        </tr>
        <tr>
          <td>
            <div class="form">
              <label for="surname">Last name</label>
              <input type="text" id="surname" placeholder="Last name" required />
            </div>
          </td>
        </tr>
        <tr>
          <td>
            <div class="form">
              <label for="name">Name</label>
              <input type="text" id="name" placeholder="Name" required />
            </div>
          </td>
        </tr>
        <tr>
          <td>
            <div class="form">
              <label for="username">Username*</label>
              <input type="text" id="username" placeholder="Username" required />
            </div>
          </td>
        </tr>
        <tr>
          <td>
            <div class="form">
              <label for="password">Password*</label>
              <input type="password" id="password" placeholder="Password" required />
            </div>
          </td>
        </tr>
        <tr>
          <td>
            <div class="form">
              <label for="confirm_password">Confirm password*</label>
              <input type="password" id="confirm_password" placeholder="Confirm password" required />
            </div>
          </td>
        </tr>
        <tr>
          <td>
            <div class="form">
              <label for="email">E-Mail*</label>
              <input type="email" id="email" placeholder="Email" required />
            </div>
          </td>
        </tr>
        <tr>
          <td>
            <div class="form">
              <label for="phone">Phone</label>
              <input type="tel" id="phone" placeholder="Phone" />
            </div>
          </td>
        </tr>
        <tr>
          <td><button id="formSubmit" type="submit" size="50" style="height: 40px" align="center"
              onclick="registerUser()"><a href="/Giao_HomePage/HomePage (2).html">Sign Up</a></button></td>
        </tr>
      </table>
    </form>
  </div>
</body>

</html>
